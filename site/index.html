<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Incident Atlas — incidentes com agentes de IA</title>
<meta name="description" content="AI Incident Atlas: mapa e linha do tempo de incidentes de segurança envolvendo agentes de IA, agrupados a partir de notícias públicas.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<!-- Vercel Web Analytics: medição sem cookies. Precisa estar ativada em Analytics, no painel do projeto. -->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header class="topo">
  <div class="faixa">
    <div class="linha-topo">
      <h1>🗺️ AI Incident Atlas</h1>
      <div class="idiomas" id="idiomas" role="group" aria-label="Idioma / Language"></div>
    </div>
    <p class="subtitulo" data-i18n="subtitulo"></p>
    <p class="atualizacao"><span data-i18n="atualizacao"></span> <span id="gerado">…</span></p>
  </div>
</header>

<main>
  <section class="cartoes" id="cartoes"></section>

  <section class="bloco">
    <div class="cabecalho-bloco">
      <h2 data-i18n="mapa_titulo"></h2>
      <p class="ajuda" id="ajuda-mapa" data-i18n="mapa_ajuda"></p>
    </div>
    <div class="mapa-caixa" id="mapa-caixa">
      <svg id="mapa" viewBox="0 0 960 460" preserveAspectRatio="xMidYMid meet" role="img"
           data-i18n-aria="mapa_aria"></svg>
      <div class="legenda" id="legenda"></div>
    </div>
    <p class="nota" id="nota-mapa"></p>
  </section>

  <section class="bloco">
    <div class="cabecalho-bloco"><h2 data-i18n="tempo_titulo"></h2>
      <p class="ajuda" data-i18n="tempo_ajuda"></p></div>
    <svg id="tempo" viewBox="0 0 960 200" preserveAspectRatio="xMidYMid meet" role="img"
         data-i18n-aria="tempo_aria"></svg>
  </section>

  <section class="bloco">
    <div class="cabecalho-bloco"><h2 id="titulo-incidentes"></h2></div>
    <div class="filtros">
      <div class="grupo"><span class="rotulo" data-i18n="f_papel"></span>
        <div id="filtro-papel" class="chips"></div></div>
      <div class="grupo"><span class="rotulo" data-i18n="f_confirmacao"></span>
        <select id="filtro-confirmacao"></select></div>
      <div class="grupo"><span class="rotulo" data-i18n="f_empresa"></span>
        <select id="filtro-empresa"></select></div>
      <div class="grupo" id="grupo-pais" hidden>
        <span class="rotulo" data-i18n="f_pais"></span>
        <button id="limpar-pais" class="chip ativo" type="button"></button>
      </div>
    </div>
    <div id="lista"></div>
  </section>
</main>

<footer class="rodape">
  <div class="faixa">
    <h2 data-i18n="rodape_titulo"></h2>
    <p data-i18n="rodape_metodo"></p>
    <p><strong data-i18n="rodape_limites_titulo"></strong><span data-i18n="rodape_limites"></span></p>
    <p class="creditos"><span data-i18n="rodape_reportar"></span>
      <a id="reportar" href="#">Reporte aqui</a>. <span data-i18n="rodape_creditos"></span></p>
  </div>
</footer>

<div id="dica" class="dica" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
